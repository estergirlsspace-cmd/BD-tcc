<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#312782">
    <meta name="referrer" content="no-referrer">
    <title>Redefinir senha | C-Warning</title>
    <script src="/preferencias.js"></script>
    <link rel="stylesheet" href="/vendor/fontes.css">
    <link rel="stylesheet" href="/vendor/phosphor/regular.css">
    <link rel="stylesheet" href="/vendor/phosphor/fill.css">
    <link rel="stylesheet" href="/tema.css">
    <link rel="stylesheet" href="/styles.css">
    <script src="/redefinir.js" defer></script>
</head>
<body class="login-body">
    <!-- Atende dois links enviados por e-mail (rotas /redefinir e /confirmar-email, mesma página):
         /redefinir#token=…        → criar nova senha (POST /api/auth/redefinir)
         /confirmar-email#token=…  → confirmar e-mail (POST /api/conta/email/confirmar)
         O token fica no fragmento (#), que o navegador não envia ao servidor nem em Referer. -->
    <main class="login">
        <section class="login-hero" aria-label="C-Warning, CEEP Lourdinha Guerra">
            <p class="login-hero__marca">
                <span class="cw-marca cw-marca--clara">C<span class="cw-marca__ponto" aria-hidden="true"></span>Warning</span>
            </p>
            <p class="login-hero__titulo">Toda a comunicação do CEEP em um só lugar.</p>
        </section>

        <section class="login-painel">
            <div class="login-conteudo">
                <form class="login-form" id="reset-form" aria-labelledby="reset-title" hidden>
                    <h1 class="login-titulo" id="reset-title">Crie uma nova senha</h1>
                    <p class="login-ajuda login-ajuda--intro">
                        Use pelo menos 8 caracteres. Ao salvar, você sai de todos os aparelhos e entra de novo
                        com a senha nova.
                    </p>
                    <div class="campo">
                        <label class="campo__rotulo" for="new-password">Nova senha</label>
                        <input class="campo__entrada" id="new-password" type="password"
                            minlength="8" maxlength="128" autocomplete="new-password" required>
                    </div>
                    <div class="campo">
                        <label class="campo__rotulo" for="confirm-password">Repita a nova senha</label>
                        <input class="campo__entrada" id="confirm-password" type="password"
                            minlength="8" maxlength="128" autocomplete="new-password" required>
                    </div>
                    <p class="login-mensagem" id="reset-message" role="alert"></p>
                    <button class="login-botao" id="reset-button" type="submit">Salvar nova senha</button>
                </form>

                <section class="login-form" id="result-panel" aria-labelledby="result-title" hidden>
                    <div class="login-confirmacao">
                        <i class="ph login-confirmacao__icone" id="result-icon" aria-hidden="true"></i>
                        <h1 class="login-titulo" id="result-title" tabindex="-1"></h1>
                        <p class="login-ajuda" id="result-text"></p>
                    </div>
                    <a class="login-botao" id="result-link" href="/">Entrar no C-Warning</a>
                </section>
            </div>
        </section>
    </main>
</body>
</html>
