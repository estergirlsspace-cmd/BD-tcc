<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#192F52">
    <title>Portal do Aluno · C·Warning</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/assets/icones/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/assets/icones/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/assets/icones/apple-touch-icon.png">
    <script src="/pwa.js" defer></script>
    <script src="/preferencias.js"></script>
    <link rel="stylesheet" href="/vendor/phosphor/regular.css">
    <link rel="stylesheet" href="/vendor/phosphor/fill.css">
    <link rel="stylesheet" href="/tema.css">
    <link rel="stylesheet" href="/notificacoes.css">
    <link rel="stylesheet" href="/componentes/formulario.css">
    <link rel="stylesheet" href="/aluno.css">
    <script src="/datas.js" defer></script>
    <script src="/notificacoes.js" defer></script>
    <script src="/componentes/formulario.js" defer></script>
    <script src="/aluno.js" defer></script>
</head>
<body class="portal-aluno">
    <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

    <header class="topo">
        <a class="topo-marca" href="#/inicio" aria-label="C-Warning, Portal do Aluno: início">
            <span class="logo-c" aria-hidden="true">C</span>
            <span class="topo-marca-texto" aria-hidden="true"><span class="topo-nome">C-Warning</span><span class="topo-sub">Portal do Aluno</span></span>
        </a>
        <div class="topo-acoes">
            <a class="topo-botao" href="#/avisos/naolidos" id="sino" aria-label="Avisos não lidos"><i class="ph ph-bell-simple" aria-hidden="true"></i><span class="sino-contador" data-contador-naolidos aria-hidden="true" hidden></span></a>
            <a class="topo-avatar" href="#/ajustes/perfil" data-avatar aria-label="Meu perfil">··</a>
        </div>
    </header>

    <div class="pagina">
        <h1 class="pagina-titulo" id="titulo-pagina" tabindex="-1">Carregando…</h1>
        <main class="conteudo" id="conteudo" tabindex="-1">
            <div class="esqueleto-lista" aria-hidden="true">
                <div class="esqueleto esqueleto-bloco"></div>
                <div class="esqueleto esqueleto-bloco"></div>
            </div>
        </main>
    </div>

    <nav class="abas" aria-label="Seções do portal">
        <a class="aba" href="#/inicio" data-secao="inicio" data-inclui="frequencia"><i class="ph-fill ph-house" aria-hidden="true"></i><span>Início</span></a>
        <a class="aba" href="#/avisos/todos" data-secao="avisos"><span class="aba-icone"><i class="ph-fill ph-megaphone-simple" aria-hidden="true"></i><span class="ponto-alerta" data-ponto-naolidos hidden></span></span><span>Avisos</span><span class="visually-hidden" data-sr-naolidos></span></a>
        <a class="aba" href="#/atividades/pendentes" data-secao="atividades"><i class="ph-fill ph-clipboard-text" aria-hidden="true"></i><span>Atividades</span></a>
        <a class="aba" href="#/horarios" data-secao="horarios"><i class="ph-fill ph-calendar-blank" aria-hidden="true"></i><span>Horários</span></a>
        <a class="aba" href="#/ajustes/perfil" data-secao="ajustes"><i class="ph-fill ph-user" aria-hidden="true"></i><span>Perfil</span></a>
    </nav>

    <p class="visually-hidden" role="status" id="status-contadores"></p>

    <dialog class="folha" id="dialogo-aviso" aria-labelledby="aviso-titulo">
        <span class="folha-alca" aria-hidden="true"></span>
        <button class="botao-icone folha-fechar" type="button" data-fechar-dialogo aria-label="Fechar aviso"><i class="ph ph-x" aria-hidden="true"></i></button>
        <div id="aviso-corpo"></div>
    </dialog>

    <dialog class="folha" id="dialogo" aria-labelledby="dialogo-titulo">
        <span class="folha-alca" aria-hidden="true"></span>
        <div class="dialogo-cabecalho">
            <h2 id="dialogo-titulo"></h2>
            <button class="botao-icone" type="button" data-fechar-dialogo aria-label="Fechar"><i class="ph ph-x" aria-hidden="true"></i></button>
        </div>
        <div id="dialogo-corpo"></div>
    </dialog>
</body>
</html>
